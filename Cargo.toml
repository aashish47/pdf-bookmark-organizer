[package]
name = "pdf-bookmark-organizer"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Reorganize existing PDF bookmarks into Front Matter, Content, and Back Matter"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
lopdf = { version = "0.46", default-features = false }
regex = "1"
